- id: agent-default-model
  config:
    provider: !!js process.env.DSH_MCP_PROVIDER
    model: !!js process.env.DSH_MCP_MODEL
    reasoningEffort: !!js process.env.DSH_MCP_THINKING_EFFORT
- id: llm-pi-ai
  config:
    providers: !!js JSON.parse(process.env.DSH_MCP_PI_PROVIDERS)
- id: llm-deepseek
  disabled: !!js process.env.DSH_MCP_PROVIDER !== 'deepseek-official'
  config: !!js JSON.parse(process.env.DSH_MCP_DEEPSEEK_PROFILE)
- id: llm-deepseek-account
  disabled: true
- id: compaction-basic
  config: !!js JSON.parse(process.env.DSH_MCP_COMPACTION_PROFILE)
- id: settings
  disabled: true
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    # Keep already-running MCP servers compatible until their worker module reloads.
    customSkillDirs: !!js JSON.parse(process.env.DSH_MCP_SKILL_DIRS ?? JSON.stringify([process.cwd() + '/.dsh/skills', process.env.DSH_HOME + '/skills']))
- id: config-editor
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-workflow
  disabled: true
